services:
  openvpn:
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - SYS_MODULE
    image: kylemanna/openvpn
    ports:
      - 1194:1194/udp
    restart: always
    volumes:
      - ./openvpn-data/conf:/etc/openvpn
      - /lib/modules:/lib/modules:ro
    privileged: true

  # Tunnel to the edge VPS (frpc-edge.toml). Version matches frps there.
  frpc-edge:
    image: fatedier/frpc:v0.71.1
    command: ["-c", "/etc/frp/frpc.toml"]
    network_mode: host
    volumes:
      - ./frpc/frpc-edge.toml:/etc/frp/frpc.toml:ro
      - ./frpc/tls:/etc/frp/tls:ro
    restart: unless-stopped
    env_file: .env
