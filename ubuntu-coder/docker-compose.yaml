# Coder server + Postgres, based on Coder's own compose.yaml.
#
# Workspaces are Docker containers on this same host (via the Docker socket),
# run with the Sysbox runtime -- see templates/docker-sysbox/.
services:
  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION}
    restart: unless-stopped
    ports:
      - "7080:7080"
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://coder:${POSTGRES_PASSWORD}@database/coder?sslmode=disable"
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      # Workspace agents connect back to this URL, so it must be reachable
      # from inside workspace containers.
      CODER_ACCESS_URL: "${CODER_ACCESS_URL}"
      # Subdomain app URLs (*.coder.<domain>); see README, "Wildcard app URLs".
      # Unset, apps are served path-based under the access URL.
      CODER_WILDCARD_ACCESS_URL: "${CODER_WILDCARD_ACCESS_URL:-}"
      # GitHub login through our own OAuth app (not Coder's default app, which
      # Coder the company administers). Existing accounts only: no sign-ups.
      # Without a client ID set, only password login is offered.
      CODER_OAUTH2_GITHUB_CLIENT_ID: "${CODER_OAUTH2_GITHUB_CLIENT_ID:-}"
      CODER_OAUTH2_GITHUB_CLIENT_SECRET: "${CODER_OAUTH2_GITHUB_CLIENT_SECRET:-}"
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "false"
      CODER_OAUTH2_GITHUB_ALLOW_EVERYONE: "true"
      CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE: "false"
    # The coder user in the image must be able to use the Docker socket.
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_home:/home/coder
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coder
    volumes:
      - coder_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coder_data:
  coder_home:
