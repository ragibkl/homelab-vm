# Listen on LAN interface only
interface=eth1
bind-interfaces

# DHCP configuration
dhcp-range=192.168.100.100,192.168.100.200,24h

# Gateway (this router)
dhcp-option=3,192.168.100.1

# DNS servers
# dhcp-option=6,8.8.8.8,8.8.4.4
dhcp-option=6,192.168.100.1      # DNS (router itself)

# Domain
domain=vmbr1

# Static DHCP leases for k8s nodes (add MAC addresses after creating VMs)
# dhcp-host=52:54:00:12:34:56,192.168.100.10,vmbr1-k8s-master
# dhcp-host=52:54:00:12:34:57,192.168.100.11,vmbr1-k8s-worker1
# dhcp-host=52:54:00:12:34:58,192.168.100.12,vmbr1-k8s-worker2
# dhcp-host=52:54:00:12:34:59,192.168.100.13,vmbr1-k8s-worker3

# Router hostname
address=/router.vmbr1/192.168.100.1
address=/router/192.168.100.1

# Logging
log-queries
log-dhcp

# Upstream resolvers: ask UniFi and two public resolvers at once and take the
# first answer, so one dropped UDP packet on the home link doesn't fail a
# lookup (it used to: Flux fetches and CoreDNS timed out several times a day).
# Outbound only.
no-resolv
server=10.15.0.1
server=1.1.1.1
server=9.9.9.9
all-servers

# Cache size
cache-size=10000

# Never forward these upstream; answer locally (NXDOMAIN) at once. Pods ask
# for things like _grpc_config.localhost, and the k3s nodes' search domain
# turns external names into <name>.vmbr1 first.
local=/localhost/
local=/vmbr1/
